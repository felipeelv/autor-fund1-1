formato: apostila-fund1

anos:
  3ano:
    publico: "crianças de aproximadamente 8 anos"
    texto: "frases curtas, ordem direta, conceitos concretos e termos históricos explicados"
    visual: "fundo branco puro; editorial collage infographic; scrapbook educativo sofisticado; visual note-taking; fotografias, pinturas, relevos escultóricos e objetos recortados; ao menos um box informativo por página; mapas apenas esquemáticos e sem fronteiras inventadas; títulos variados"
    natureza_sociedade: "distinguir povos, tempos e territórios; evitar generalizações; mostrar presença indígena no passado e no presente"
    revisao: "conferir fatos, datas, nomes, dados, fontes e representações culturais antes da geração"
