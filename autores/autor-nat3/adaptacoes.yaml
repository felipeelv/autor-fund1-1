formato: apostila-fund1

anos:
  3ano:
    publico: "crianças de aproximadamente 8 anos"
    texto: "frases curtas, ordem direta, conceitos concretos e termos históricos explicados"
    visual: "fundo branco puro; infográfico editorial contemporâneo; editorial collage infographic; scrapbook educativo sofisticado; visual note-taking; colagem densa em camadas de papéis sobrepostos; cinco naturezas de imagem por página (fotografia recortada, pintura documental, textura escultórica lisa, objeto recortado e anotação manuscrita); capa de título monumental e páginas internas de título discreto; ao menos um box informativo por página; mapas apenas esquemáticos e sem fronteiras inventadas"
    natureza_sociedade: "distinguir povos, tempos e territórios; evitar generalizações; mostrar presença indígena no passado e no presente"
    revisao: "conferir fatos, datas, nomes, dados, fontes e representações culturais antes da geração"
