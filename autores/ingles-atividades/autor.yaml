autor:
  id: ingles-atividades
  nome: "Inglês — atividades — Fundamental I"
  disciplina: "Inglês — atividades — Fundamental I"
  ativo: true
  renderizador_padrao: texto
  formatos:
    - apostila-fund1

  prompt_prefixo: |-
    Use case: scientific-educational.
    Asset type: página vertical de atividades de Inglês de apostila brasileira
    do Ensino Fundamental I, para o aluno responder. A página não explica
    conteúdo novo: ela pede que a criança faça.

    DIREÇÃO VISUAL ESTÁVEL: mistura de colagem editorial contemporânea com
    sketchnote profissional e visual note-taking, na mesma família visual do
    material de conteúdo. Usar papéis recortados, pintura guache, ilustrações
    semirrealistas e textura tátil discreta junto de setas desenhadas a
    marcador, círculos, sublinhados, estrelas, conectores e mini-ícones. Fundo
    branco quente, margens seguras e caminho de leitura imediato. Tipografia
    sans-serif arredondada, grande e muito legível; lettering manual apenas em
    destaques curtos.

    ESTRUTURA DE ATIVIDADE: cada atividade recebe número e enunciado próprios,
    exatamente como a fonte os escreve, e um espaço de resposta real e
    proporcional à idade — linha pautada, quadro vazio, grade ou par de opções.
    O espaço de resposta é parte do conteúdo da página, nunca sobra de layout.
    A ilustração dá a pista do sentido e nunca ocupa, cobre ou encosta no espaço
    destinado à escrita da criança.

    PALETA DIDÁTICA: grafite #263238 e branco quente #FFFDF8 como estrutura;
    vermelho #E94B3C, azul #2F6FD0, amarelo #F6C945, verde #43A66B, laranja
    #F28C32 e roxo #8B5FBF como cores do conteúdo. Cada palavra de cor precisa
    corresponder visualmente à cor correta.

    Representar crianças brasileiras diversas, com proporções naturais,
    expressões gentis e ações pedagógicas claras. Todo texto visível precisa ser
    um dos trechos literais solicitados no prompt da página.

  prompt_sufixo: |-
    TRAVAS FINAIS: uma única página vertical 2:3; fundo opaco; composição
    organizada e pronta para apostila. Renderizar cada texto literal exatamente
    uma vez, com ortografia inglesa correta e sem acrescentar palavras.

    TRAVA PRINCIPAL DA PÁGINA DE ATIVIDADE: **nada pode aparecer respondido**.
    Nenhuma resposta escrita, nenhum item circulado, nenhum `Yes` ou `No`
    marcado, nenhum visto ou xis preenchido pela página, nenhum quadro de
    desenho com desenho dentro, nenhuma lacuna completada. Toda linha de
    resposta fica vazia e visível. Não criar, cortar, reescrever, reordenar nem
    renumerar atividade: a página reproduz o que a fonte traz.

    Não usar logotipo, marca, QR code, assinatura, watermark, número de página,
    legenda automática, texto aleatório, letra deformada, serifas, Comic Sans,
    3D, estética de filme infantil, mascote, personagem falante, gradientes neon
    ou fundo escuro.

  parametros_api:
    qualidade: "high"
    tamanho: "1024x1536"
    formato: "png"
    fundo: "opaque"
