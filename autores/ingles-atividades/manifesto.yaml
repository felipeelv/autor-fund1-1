schema: 1

disciplina:
  id: ingles-atividades
  nome: "Inglês — atividades — Fundamental I"
  estado: ativo
  escopo: >-
    páginas de atividades de Inglês para o Fundamental I: caderno de casa,
    exercícios de fixação e revisão, para o aluno responder
  modelo_imagem: "gpt-image-2"
  modelos_imagem_autorizados:
    - "gpt-image-2"
    - "grok-imagine-image-2.0"
  formato_padrao: "apostila-fund1"

configuracao:
  autor: "autor.yaml"
  adaptacoes: "adaptacoes.yaml"
  kit: null

fonte_operacional:
  tipo: "prompt versionado interno"
  caminho: "anos/<ano>/prompts/<ano-letivo>/<bimestre>/<arquivo>.md"
  selecao: "projeto YAML ou argumento --prompt da CLI"
  dependencia_externa: false

fonte_conteudo:
  tipo: "fonte textual versionada interna"
  caminho: "anos/<ano>/fontes/<periodo>/<arquivo>.md"
  dependencia_externa: false

estrutura_por_ano:
  fontes: "anos/<ano>/fontes/<periodo>"
  conteudos: "anos/<ano>/conteudos/<ano-letivo>/<bimestre>"
  prompts: "anos/<ano>/prompts/<ano-letivo>/<bimestre>"

direcao:
  autor: "direcao/AUTOR.md"
  padrao_visual: "direcao/PADRAO-VISUAL-3ANO.md"
  memoria: "direcao/MEMORIA.md"

producao:
  projetos: "projetos"
  registros: "registros"
  revisao_externa: "_revisao/ingles-atividades/<ano>/<bimestre>/<unidade>"
  aprovadas_externa: "aprovadas/ingles-atividades/<ano>/<bimestre>/<unidade>"

anos: [1ano, 2ano, 3ano]
anos_planejados: [1ano, 2ano]
