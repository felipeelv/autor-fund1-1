formato: apostila-fund1

anos:
  1ano:
    publico: "crianças de aproximadamente 6 anos"
    texto: "palavras isoladas, frases-modelo curtas e tipografia grande"
    visual: "objeto concreto antes da estrutura linguística"

  3ano:
    publico: "crianças de aproximadamente 8 anos"
    texto: "frases curtas completas, lacunas para completar e enunciado direto"
    visual: "ilustração dá a pista do sentido e nunca ocupa o espaço de escrita"
