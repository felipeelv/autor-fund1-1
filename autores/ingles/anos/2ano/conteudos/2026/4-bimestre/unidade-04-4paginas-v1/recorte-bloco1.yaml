# Divisão combinada com Nicolas Basso em 17/09/2026: 4 páginas na unidade (2
# por bloco), mesmo padrão do 1º ano desta mesma Unidade 4. Números entre
# colchetes são o "#" do `preparar.py --inventario` desta fonte.
#
# p1 = "My Toys": abertura "nesta unidade você vai aprender" + vocabulário
# dos 6 brinquedos + estrutura "I have a..." (inclui a curiosidade sobre o
# teddy bear, que a fonte encadeia na mesma seção) -> [3, 4, 6, 7]
# p2 = "My Favorite Toy & Colors": estrutura "My favorite toy is...", a
# curiosidade sobre a boneca ser o brinquedo mais antigo, e o vocabulário das
# 10 cores -> [9, 11, 13, 14, 16]
#
# Música ([8], [12]) fica fora — ver AUTOR.md, "não comprimir músicas,
# diálogos e revisão em uma mesma página".

paginas:
  - numero: 1
    slug: "my-toys"
    titulo: "My Toys"
    secoes: [3, 4, 6, 7]

  - numero: 2
    slug: "my-favorite-toy-and-colors"
    titulo: "My Favorite Toy & Colors"
