autor:
  id: portugues-atividades
  nome: "Português — atividades — Fundamental I"
  disciplina: "Português — atividades — Fundamental I"
  ativo: true
  renderizador_padrao: texto
  formatos:
    - apostila-fund1

  prompt_prefixo: |-
    Use case: scientific-educational.
    Asset type: página vertical de atividades de Língua Portuguesa de apostila
    brasileira do Ensino Fundamental I, para o aluno responder. A página não
    apresenta conteúdo novo: ela pede que a criança leia, complete e escreva.

    DIREÇÃO VISUAL ESTÁVEL: mistura de colagem editorial contemporânea com
    sketchnote profissional e visual note-taking, na mesma família visual do
    material de conteúdo. Papéis recortados, pintura guache, ilustrações
    semirrealistas e textura tátil discreta. Fundo branco quente, margens
    seguras e caminho de leitura imediato. Tipografia sans-serif arredondada,
    grande e muito legível.

    TRAVA TIPOGRÁFICA DA ALFABETIZAÇÃO: a letra é conteúdo, não decoração. Cada
    letra impressa aparece com desenho correto, completo e reconhecível, no tipo
    pedido — caixa alta ou minúscula de imprensa —, sem deformação, sem letra
    espelhada, sem glifo inventado e sem misturar tipos dentro da mesma palavra.
    Acentos, cedilha e til inteiros e na posição certa.

    ESTRUTURA DE ATIVIDADE: cada atividade recebe número e enunciado próprios,
    exatamente como a fonte os escreve, e um espaço de escrita real — pauta,
    quadriculado de caligrafia, lacuna dentro da palavra, linha de frase ou
    quadro de desenho. A pauta é dimensionada pela idade: quanto mais nova a
    criança, mais alta a linha.

    PALETA DIDÁTICA: grafite #263238 e branco quente #FFFDF8 como estrutura;
    vermelho #E94B3C, azul #2F6FD0, amarelo #F6C945, verde #43A66B, laranja
    #F28C32 e roxo #8B5FBF como cores do conteúdo.

    Todo texto visível precisa ser um dos trechos literais do prompt da página.

  prompt_sufixo: |-
    TRAVAS FINAIS: uma única página vertical 2:3; fundo opaco; composição
    organizada e pronta para apostila. Renderizar cada texto literal exatamente
    uma vez, com ortografia da norma brasileira vigente e acentuação correta.

    TRAVA PRINCIPAL DA PÁGINA DE ATIVIDADE: **nada pode aparecer respondido**.
    Nenhuma palavra escrita na pauta, nenhuma lacuna completada, nenhuma letra
    traçada por cima do pontilhado, nenhuma alternativa assinalada, nenhuma
    ligação já feita, nenhum quadro de desenho com desenho dentro. Toda linha de
    escrita fica vazia e visível.

    O pontilhado de traçado é a guia da letra a ser escrita, e permanece
    pontilhado: nunca aparece reforçado, preenchido ou convertido em letra
    sólida.

    Não criar, cortar, reescrever, reordenar nem renumerar atividade. Não trocar
    palavra por sinônimo nem corrigir a grafia da fonte.

    Não usar logotipo, marca, QR code, assinatura, watermark, número de página,
    legenda automática, texto aleatório, letra deformada, letra espelhada,
    serifas, Comic Sans, 3D, mascote, personagem falante, gradientes neon ou
    fundo escuro.

  parametros_api:
    tamanho: "auto"
    qualidade: "medium"
    formato: "jpeg"
    fundo: "auto"
    moderacao: "auto"
    proporcao: "2:3"
    resolucao: "2k"
