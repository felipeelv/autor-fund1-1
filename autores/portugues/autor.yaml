autor:
  id: portugues
  nome: "Português — Fundamental I"
  disciplina: "Português — Fundamental I"
  ativo: true
  renderizador_padrao: texto
  formatos:
    - apostila-fund1

  prompt_prefixo: |-
    Use case: scientific-educational.
    Asset type: página vertical de apostila brasileira de Língua Portuguesa para
    os anos iniciais do Ensino Fundamental, em fase de alfabetização e de
    consolidação da leitura e da escrita.

    DIREÇÃO VISUAL ESTÁVEL: mistura de colagem editorial contemporânea com
    sketchnote profissional e visual note-taking. Usar papéis recortados,
    rasgados e sobrepostos, fita adesiva, post-its, pintura guache, ilustrações
    semirrealistas de contorno orgânico e textura tátil discreta, junto de setas
    desenhadas a marcador, círculos, sublinhados, conectores e mini-ícones. A
    página deve parecer um mapa visual feito à mão e refinado editorialmente,
    não uma grade rígida de cartões. Fundo branco puro, com o branco aparecendo
    como corredor entre os recortes; sem tom creme, sem textura geral, sem grade
    e sem pontilhado contínuo cobrindo a página. Tipografia sans-serif
    arredondada, grande e muito legível; lettering manual apenas em destaques
    curtos, e nunca na letra que está sendo ensinada.

    TRAVA TIPOGRÁFICA DA ALFABETIZAÇÃO: a letra é conteúdo, não decoração. Cada
    letra aparece com desenho correto, completo e reconhecível, no tipo pedido —
    caixa alta ou minúscula de imprensa —, sem deformação, sem letra espelhada,
    sem glifo inventado e sem misturar tipos dentro da mesma palavra. Acento,
    cedilha e til aparecem inteiros e sobre a letra certa. A letra ou palavra em
    estudo recebe escala de protagonista, isolada do resto da composição.

    PALETA DIDÁTICA: grafite #263238 sobre branco puro #FFFFFF como estrutura;
    vermelho #E94B3C para alertas e exceções, azul #2F6FD0 para conceitos,
    amarelo #F6C945 para destaques e sílaba tônica, verde #43A66B para
    verificações, laranja #F28C32 para agrupamentos e famílias de palavras e
    roxo #8B5FBF para conexões e pontuação. Uma cor guarda sempre o mesmo papel
    dentro da página.

    COMPOSIÇÃO: cinco a sete núcleos visuais distribuídos em seis a nove
    recortes ou boxes físicos separados, com respiro branco entre eles. Variar
    escala, alinhamento e posição dos títulos entre páginas consecutivas.
    Representar crianças brasileiras diversas, com proporções naturais e ações
    pedagógicas claras. A palavra escrita corresponde exatamente ao objeto que a
    imagem mostra. Todo texto visível precisa ser um dos trechos literais do
    prompt da página.

  prompt_sufixo: |-
    TRAVAS FINAIS: uma única página vertical 2:3; fundo opaco; composição de
    visual note-taking rica, organizada e pronta para apostila. Nenhum texto
    pode ficar pequeno, apertado ou sem relação visual com uma imagem.
    Renderizar cada texto literal exatamente uma vez, com a ortografia e a
    acentuação da norma brasileira vigente.

    Não trocar palavra por sinônimo, não corrigir nem modernizar a grafia da
    fonte, não separar sílabas de forma diferente da pedida, não deformar nem
    espelhar letra, não misturar caixa alta e minúscula dentro da mesma palavra
    e não inventar palavra, exemplo, frase, verso ou texto.

    Não usar logotipo, marca, QR code, assinatura, watermark, número de página,
    legenda automática, texto aleatório, letra deformada, letra espelhada,
    serifas, Comic Sans, 3D decorativo, estética de filme infantil, mascote,
    personagem falante, gradientes neon, fundo escuro ou fundo creme.

  parametros_api:
    tamanho: "auto"
    qualidade: "medium"
    formato: "jpeg"
    fundo: "auto"
    moderacao: "auto"
    proporcao: "2:3"
    resolucao: "2k"
