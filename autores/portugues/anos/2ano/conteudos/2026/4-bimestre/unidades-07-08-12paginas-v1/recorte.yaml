# Segundo lote de Português do 2º ano (primeiro foi a Unidade 6, 3º bimestre,
# 8 páginas). A fonte cobre duas unidades — Unidade 7 (O Mundo dos Contos,
# capítulos 1 e 2) e Unidade 8 (Criadores de Histórias, capítulo 1) — em 12
# páginas, na mesma proporção de densidade da Unidade 6 (fonte de tamanho
# quase idêntico: 605 x 604 linhas). Números entre colchetes são o "#" do
# `preparar.py --inventario` desta fonte.
#
# p01 recebeu sign-off (v2, com a capa "Nesta unidade, você vai" da seção 4,
# que faltava na v1) em 08/09/2026. Lote completo liberado nesse padrão de
# estilo. Ficam fora do recorte as seções "🗣️ HORA DE CONVERSAR" em toda a
# fonte — são roteiro de conversa em sala, não conteúdo de página (mesmo
# critério já usado na Unidade 6).
#
# UNIDADE 7 — O MUNDO DOS CONTOS, CAPÍTULO 1 — ELEMENTOS QUE CONTAM HISTÓRIAS
#
# p01 = "O que é um conto e os elementos da narrativa"      -> [4, 6, 8, 10]
# p02 = "Personagem e Espaço"                                -> [11, 12]
# p03 = "Tempo e Problema"                                    -> [13, 14]
# p04 = "Solução e Estrutura do Conto"                        -> [15, 16, 17, 18, 19, 20]
# p05 = "Vocabulário emocional e expressões idiomáticas"      -> [21, 22, 23, 24, 25, 26, 27]
#
# p02-p04 usam o mesmo exemplo do livro "O Homem que Amava Caixas" (o
# personagem = o homem/o filho) para dar continuidade visual entre as três
# páginas. Em p05, cada uma das 5 categorias de sentimento é reduzida de
# 5-6 palavras da fonte para 3-4 (mesmas palavras, corte de densidade).
#
# UNIDADE 7 — CAPÍTULO 2 — O SEGREDO DA CEDILHA
#
# p06 = "Cedilha e o que é plural"                            -> [30, 31, 32]
# p07 = "Regras do plural: +S, +ES, L→IS"                     -> [33, 34, 35]
