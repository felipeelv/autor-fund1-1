#
# p09-p11 usam o mesmo exemplo "Lucas" da fonte para dar continuidade visual
# entre as páginas de planejamento. Em p12, a Camada 3 (Ortografia
# Consolidada, 31 linhas de fonte) é condensada a uma linha por item do
# checklist, sem as sub-explicações — mesmos itens, corte de densidade — e
# "Reescrevendo e melhorando" [63] vira uma caixa pequena de fechamento, não
# um núcleo próprio.

