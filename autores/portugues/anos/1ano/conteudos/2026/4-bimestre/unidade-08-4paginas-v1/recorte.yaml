# Divisão combinada com Nicolas Basso em 26/08/2026: mesmo padrão da
# Unidade 7 deste bimestre — ver recorte.yaml de lá e ORGANIZACAO.md.
#
# p1 = abertura do Cap. 1: índice da unidade (seção 18, "NESTA UNIDADE, VOCÊ
# VAI") + letras que assoviam (provocação, "Hora de conversar" sapo/casa/
# osso) + o som do S (S no começo, S entre vogais, "Você sabia?").
#
# p2 = fecho do Cap. 1: quando usar SS + exemplos (massa, osso, pássaro,
# pessoa) + tabela COMPARE (asa/assa, aceso/acesso) + "Lembre-se!".
#
# p3 = abertura do Cap. 2: lendo com entonação — as três regras de pontuação
# (ponto final, exclamação, interrogação), cada uma com seu exemplo. A seção
# 25 traz regras e prática num só bloco na fonte; aqui fica só a parte das
# regras, a prática vai para a p4.
#
# p4 = fecho do Cap. 2: a parlenda de prática ("Cadê o toicinho que estava
# aqui?") completa, como página de recital — fecha o objetivo da unidade
# "fazer um recital para a turma". Mesma seção 25 da p3, recorte manual: aqui
# entra só a parlenda de prática, não as regras já usadas na p3.

paginas:
  - numero: 1
    slug: "letras-que-assoviam-o-som-do-s"
    titulo: "Letras que assoviam: o som do S"
    secoes: [18, 20, 21, 22]

  - numero: 2
