# Divisão combinada com Nicolas Basso em 26/08/2026: 2 capítulos, 2 páginas
# por capítulo (abertura + fecho), seguindo o mesmo padrão da Unidade 6 do 3º
# bimestre deste ano — ver ORGANIZACAO.md e PADRAO-VISUAL-1ANO.md, seção
# "Densidade e conteúdo".
#
# p1 = abertura do Cap. 1: índice da unidade (seção 4, "NESTA UNIDADE, VOCÊ
# VAI") + cantiga (definição, "Ciranda, cirandinha", rimas) + parlenda
# (definição, "Um, dois, feijão com arroz", rimas) — a fonte encadeia os
# quatro sub-temas em sequência direta, sem transição perdida.
#
# p2 = fecho do Cap. 1: encontrando rimas ("Hoje é domingo" + tabela +
# "Agora você!") + sinônimos e antônimos (as duas tabelas).
#
# p3 = abertura do Cap. 2: letras que mudam o som — provocação caro/carro +
# R no começo (forte) + R no meio entre vogais (fraco).
#
# p4 = fecho do Cap. 2: quando usar RR + exemplos + "Lembre-se!" + tabela
# COMPARE (caro/carro, moro/morro, vara/varra).

