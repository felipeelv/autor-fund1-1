# Reescrita de unidade-06-6paginas-v1 para 4 páginas, a pedido de Nicolas
# Basso em 20/08/2026: crianças do 1º ano quase não leem ainda, e reduzir o
# número de páginas concentra a atenção sem perder conteúdo literal. A
# recorte-v1 de 6 páginas e seus prompts continuam no repositório como
# histórico, não como estrutura ativa desta unidade.
#
# A fonte rotula esta unidade como "UNIDADE 8", mas ela ocupa a posição da
# Unidade 6 do 3º bimestre — ver nota em ORGANIZACAO.md.
#
# Cada página junta dois sub-temas que a própria fonte encadeia:
# p1 = abertura/conversa + regra de S/Z (a fonte liga os dois com a frase
# "antes de escrever nossa história, vamos aprender mais uma regra!");
# p2 = roteiro da história + início/meio/fim (a mesma seção de planejamento,
# a fonte segue direto de uma para a outra).
#
# Seção 20 ("NESTA UNIDADE, VOCÊ VAI") fica de fora do recorte automático,
# mas seu conteúdo literal é reincluído manualmente na COMPOSIÇÃO da página 1
# como índice da unidade, sem os dois itens sem desenvolvimento no corpo do
# texto ("criar o livro da turma", "organizar o portfólio do ano") sendo
# tratados como promessa resolvida — aparecem como itens do índice, não como
# páginas dedicadas.

paginas:
  - numero: 1
    slug: "vamos-criar-nossa-historia-e-som-de-z"
    titulo: "Vamos criar nossa história — e a regra de S e Z"
    secoes: [22, 23, 24]

  - numero: 2
    slug: "roteiro-inicio-meio-e-fim"
    titulo: "O roteiro da história: início, meio e fim"
    secoes: [25, 26]

  - numero: 3
