formato: apostila-fund1

anos:
  3ano:
    publico: "crianças de aproximadamente 8 anos"
    texto: >-
      frases curtas e afirmativas, vocabulário concreto, uma ideia por bloco;
      o nome técnico entra depois da observação, nunca antes
    visual: >-
      fundo branco puro; recortes de papel separando observação, explicação,
      exemplo e síntese; ilustração semirrealista do ser vivo, da paisagem ou
      da cena social descrita; títulos com tamanho e posição variados entre
      páginas consecutivas
    natureza: >-
      preservar nomes de seres vivos, partes do corpo, ciclos, elementos da
      paisagem e relações ecológicas exatamente como a fonte descreve; anatomia
      e comportamento reais, sem antropomorfizar
    sociedade: >-
      preservar nomes de lugares, períodos, ofícios e práticas culturais;
      representar famílias, comunidades e povos com diversidade real e sem
      estereótipo
