estrutura_por_ano:
  fontes: "anos/<ano>/fontes/<periodo>"
  conteudos: "anos/<ano>/conteudos/<ano-letivo>/<bimestre>"
  prompts: "anos/<ano>/prompts/<ano-letivo>/<bimestre>"

direcao:
  autor: "direcao/AUTOR.md"
  padrao_visual: "direcao/PADRAO-VISUAL-3ANO.md"
  memoria: "direcao/MEMORIA.md"

producao:
  projetos: "projetos"
  registros: "registros"
  revisao_externa: "_revisao/natureza-e-sociedade/<ano>/<bimestre>/<unidade>"
  aprovadas_externa: "aprovadas/natureza-e-sociedade/<ano>/<bimestre>/<unidade>"

anos: [3ano]
anos_planejados: []
