    páginas de apostila de Natureza e Sociedade para o 3º ano do Fundamental I,
    integrando Ciências da Natureza, Geografia e História do lugar de vivência
  modelo_imagem: "grok-imagine-image-2.0"
  modelos_imagem_autorizados:
    - "grok-imagine-image-2.0"
    - "gpt-image-2"
  formato_padrao: "apostila-fund1"

